name: Update PARI results
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: read
concurrency:
  group: pari-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test test.mjs
      - run: node run.mjs
        env:
          PARI_INGEST_TOKEN: ${{ secrets.PARI_INGEST_TOKEN }}
          PARI_SITE_URL: ${{ vars.PARI_SITE_URL }}
